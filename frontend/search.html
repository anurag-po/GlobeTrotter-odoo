<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Destinations &amp; Activities — GlobeTrotter</title>
  <script>
    if (!localStorage.getItem('gt_user')) {
      window.location.replace('login.html');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .search-chip-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0 24px 0;
    }
    .search-chip {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--clr-bg);
      border: 1px solid var(--clr-border);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--clr-text);
      transition: all 0.2s ease;
    }
    .search-chip.active {
      background: var(--clr-primary);
      color: #fff;
      border-color: var(--clr-primary);
    }
    .search-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .search-card {
      background: var(--clr-white);
      border-radius: var(--radius-md);
      border: 1px solid var(--clr-border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease;
    }
    .search-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header class="header">
    <a href="index.html" class="header__logo">GlobeTrotter</a>
    <button class="header__hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="header__nav">
      <a href="index.html">Home</a>
      <a href="trips.html">My Trips</a>
      <a href="search.html" class="active">Explore</a>
      <a href="community.html">Community</a>
      <a href="calendar.html">Calendar</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html" style="display: none;">Admin</a>
    </nav>
    <div class="header__profile" title="Profile"><i class="fas fa-user"></i></div>
  </header>

  <!-- Search & Filter Toolbar -->
  <section class="toolbar" aria-label="Search and Filter Toolbar">
    <div class="toolbar__search" style="flex: 1; max-width: 600px;">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="liveSearchInput" placeholder="Search destinations, tours, cities, activities..." oninput="handleSearchFilter()">
    </div>
  </section>

  <!-- Search Results Main Content -->
  <main class="page">
    
    <!-- Category Filter Chips -->
    <div class="search-chip-group">
      <button type="button" class="search-chip active" onclick="setCategoryFilter('all', this)">All</button>
      <button type="button" class="search-chip" onclick="setCategoryFilter('Sightseeing', this)">Sightseeing</button>
      <button type="button" class="search-chip" onclick="setCategoryFilter('Adventure', this)">Adventure</button>
      <button type="button" class="search-chip" onclick="setCategoryFilter('Heritage', this)">Heritage</button>
      <button type="button" class="search-chip" onclick="setCategoryFilter('Food & Culture', this)">Food &amp; Culture</button>
      <button type="button" class="search-chip" onclick="setCategoryFilter('Relaxation', this)">Relaxation</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="searchResultsTitle" class="section-title" style="margin: 0;">Explore Catalog</h2>
      <span id="resultsCountBadge" class="badge" style="background: var(--clr-primary-light); color: var(--clr-primary); font-weight: 700;">Showing All</span>
    </div>

    <!-- Search Results Grid -->
    <div id="searchResultsGrid" class="search-grid">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    let activeCategory = 'all';

    function getCombinedCatalog() {
      const places = (window.AdminModule ? window.AdminModule.getPlaces() : []).map(p => ({
        type: 'Destination',
        title: `${p.name}, ${p.country}`,
        category: p.region || 'Region',
        price: `₹${p.avgCost}`,
        description: p.description || 'Popular tourist circuit and travel corridor.',
        actionUrl: 'create-trip.html',
        actionLabel: 'Plan Trip Here'
      }));

      const activities = (window.AdminModule ? window.AdminModule.getActivities() : []).map(a => ({
        type: 'Activity',
        title: a.name,
        category: a.category || 'Sightseeing',
        price: `₹${a.cost}`,
        description: `Located in ${a.place} • Duration: ${a.duration || '1.5 hrs'} • ${a.description || ''}`,
        actionUrl: 'build-itinerary.html',
        actionLabel: 'Add to Itinerary'
      }));

      return [...places, ...activities];
    }

    function renderSearchResults(items) {
      const grid = document.getElementById('searchResultsGrid');
      const countBadge = document.getElementById('resultsCountBadge');
      if (!grid) return;

      countBadge.textContent = `${items.length} Results Found`;

      if (items.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 48px 20px; background: var(--clr-white); border-radius: var(--radius-md); border: 1px dashed var(--clr-border);">
            <i class="fas fa-search" style="font-size: 2.5rem; color: var(--clr-text-muted); margin-bottom: 12px;"></i>
            <h3>No matches found</h3>
            <p style="color: var(--clr-text-muted);">Try typing a different destination, activity, or clearing category filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="search-card">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
              <span class="badge" style="background: ${item.type === 'Destination' ? 'var(--clr-primary-light)' : '#FEF3C7'}; color: ${item.type === 'Destination' ? 'var(--clr-primary)' : '#D97706'}; font-weight: 700; font-size: 0.75rem;">
                ${item.type}: ${item.category}
              </span>
              <strong style="color: var(--clr-text); font-size: 1.05rem;">${item.price}</strong>
            </div>
            <h3 style="margin: 0 0 8px 0; font-size: 1.1rem; color: var(--clr-text);">${item.title}</h3>
            <p style="color: var(--clr-text-muted); font-size: 0.85rem; line-height: 1.4; margin: 0 0 16px 0;">${item.description}</p>
          </div>
          <a href="${item.actionUrl}" class="btn btn--primary btn--sm" style="text-align: center; font-weight: 700;">
            ${item.actionLabel} &rarr;
          </a>
        </div>
      `).join('');
    }

    function handleSearchFilter() {
      const query = document.getElementById('liveSearchInput').value.trim().toLowerCase();
      let items = getCombinedCatalog();

      if (activeCategory !== 'all') {
        items = items.filter(item => item.category.toLowerCase().includes(activeCategory.toLowerCase()));
      }

      if (query) {
        items = items.filter(item => 
          item.title.toLowerCase().includes(query) ||
          item.description.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query)
        );
      }

      renderSearchResults(items);
    }

    function setCategoryFilter(category, btn) {
      activeCategory = category;
      document.querySelectorAll('.search-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      handleSearchFilter();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSearchResults(getCombinedCatalog());
    });
  </script>
</body>
</html>

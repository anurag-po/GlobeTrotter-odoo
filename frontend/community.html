<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Hub &amp; Traveler Stories — GlobeTrotter</title>
  <script>
    if (!localStorage.getItem('gt_user')) {
      window.location.replace('login.html');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .community-feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .post-card {
      background: var(--clr-white);
      border-radius: var(--radius-md);
      border: 1px solid var(--clr-border);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .post-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--clr-primary-light);
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .author-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .author-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-primary), #0284C7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .post-image-thumb {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin: 12px 0;
      border: 1px solid var(--clr-border);
    }
    .post-actions {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--clr-border);
      font-size: 0.88rem;
      color: var(--clr-text-muted);
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--clr-text-muted);
      transition: color 0.2s ease;
    }
    .action-btn:hover, .action-btn.liked {
      color: #DC2626;
    }
    .comment-item {
      padding: 10px 14px;
      background: var(--clr-bg);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Header Component -->
  <header class="header">
    <a href="index.html" class="header__logo">GlobeTrotter</a>
    <button class="header__hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="header__nav">
      <a href="index.html">Home</a>
      <a href="trips.html">My Trips</a>
      <a href="search.html">Explore</a>
      <a href="community.html" class="active">Community</a>
      <a href="calendar.html">Calendar</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html" style="display: none;">Admin</a>
    </nav>
    <div class="header__profile" title="Profile"><i class="fas fa-user"></i></div>
  </header>

  <!-- Main Page Container -->
  <main class="page">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 class="page-heading__title" style="margin: 0;">Explorer Community Feed</h1>
        <p class="page-heading__subtitle">Discover verified itineraries, field notes, and insider recommendations from fellow travelers.</p>
      </div>
      <button type="button" class="btn btn--primary" onclick="openCreatePostModal()" style="font-weight: 700;">
        <i class="fas fa-pen-to-square"></i> Share Your Story
      </button>
    </div>

    <!-- Posts Feed Container -->
    <div id="communityFeedContainer" class="community-feed">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <!-- Modal: Create Post -->
  <div class="modal-overlay" id="createPostModal">
    <div class="modal-card" style="max-width: 540px;">
      <div class="modal-header">
        <h3>Share a Travel Story</h3>
        <button type="button" class="modal-close" onclick="closeCreatePostModal()">&times;</button>
      </div>
      <form id="createPostForm" onsubmit="handleCreatePost(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Story Title *</label>
            <input type="text" id="postTitle" class="form-control" placeholder="e.g. Sunset Boat Cruise in Lake Pichola" required>
          </div>
          <div class="form-group">
            <label class="form-label">Destination Tag *</label>
            <input type="text" id="postLocation" class="form-control" placeholder="e.g. Udaipur, Rajasthan" required>
          </div>
          <div class="form-group">
            <label class="form-label">Story &amp; Travel Tips *</label>
            <textarea id="postContent" class="form-control" rows="4" placeholder="Share your experience, recommendations, budget tips, and favorite spots..." required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Attach Image URL (Optional)</label>
            <input type="url" id="postImageUrl" class="form-control" placeholder="https://images.unsplash.com/photo-...">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn--outline" onclick="closeCreatePostModal()">Cancel</button>
          <button type="submit" class="btn btn--primary">Publish to Community</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Post Details & Comments -->
  <div class="modal-overlay" id="postDetailModal">
    <div class="modal-card" style="max-width: 650px;">
      <div class="modal-header">
        <h3 id="detailPostTitle" style="margin: 0; font-size: 1.25rem;">Travel Story</h3>
        <button type="button" class="modal-close" onclick="closePostDetailModal()">&times;</button>
      </div>
      <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
        <div class="post-header" style="margin-bottom: 8px;">
          <div class="author-info">
            <div id="detailAuthorAvatar" class="author-avatar">U</div>
            <div>
              <strong id="detailAuthorName" style="color: var(--clr-text); font-size: 0.95rem;">Author</strong>
              <div id="detailPostDate" style="font-size: 0.78rem; color: var(--clr-text-muted);">Date</div>
            </div>
          </div>
          <span id="detailPostLocation" class="badge" style="background: var(--clr-primary-light); color: var(--clr-primary); font-weight: 700;">Location</span>
        </div>

        <img id="detailPostImage" src="" alt="Story Image" style="display: none; width: 100%; max-height: 320px; object-fit: cover; border-radius: var(--radius-sm); margin: 12px 0;">

        <p id="detailPostBody" style="color: var(--clr-text); line-height: 1.6; font-size: 0.95rem; margin: 14px 0 20px 0;"></p>

        <!-- Comments Section -->
        <div style="border-top: 1px solid var(--clr-border); padding-top: 18px; margin-top: 18px;">
          <h4 style="margin-top: 0; margin-bottom: 12px; font-size: 1rem; color: var(--clr-text);">
            <i class="fas fa-comments"></i> Discussion &amp; Comments (<span id="detailCommentCount">0</span>)
          </h4>

          <div id="detailCommentsList" style="margin-bottom: 16px;">
            <!-- Injected comments -->
          </div>

          <!-- Add Comment Form -->
          <form id="addCommentForm" onsubmit="handleAddComment(event)" style="display: flex; gap: 10px;">
            <input type="hidden" id="activeCommentPostId">
            <input type="text" id="inputCommentText" class="form-control" placeholder="Write a comment or ask a question..." required style="flex: 1;">
            <button type="submit" class="btn btn--primary btn--sm" style="font-weight: 700; padding: 0 16px;">Post</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const DEFAULT_POSTS = [
      {
        id: 'post-1',
        title: 'Sunset Boat Cruise on Lake Pichola — Magic in Udaipur',
        author: 'Karan Patel',
        location: 'Udaipur, Rajasthan',
        date: 'Aug 18, 2026',
        content: 'Rented a private wooden boat at sunset around Jag Mandir. The reflection of City Palace on the lake during golden hour was pure magic! Make sure to book the 5:30 PM slot for the best lighting.',
        imageUrl: 'https://images.unsplash.com/photo-1615836245337-f5b9b2303f10?auto=format&fit=crop&w=800&q=80',
        likes: 48,
        liked: false,
        comments: [
          { author: 'Rohan Verma', date: 'Aug 19, 2026', text: 'Stunning capture! Did you have to book tickets in advance?' },
          { author: 'Karan Patel', date: 'Aug 19, 2026', text: 'Yes, booking online saves around 45 minutes of queuing.' }
        ]
      },
      {
        id: 'post-2',
        title: 'Hidden Bamboo Alleyways & Ramen Trails in Tokyo',
        author: 'Kenji Sato',
        location: 'Tokyo, Japan',
        date: 'Aug 14, 2026',
        content: 'Beyond the crowded Shibuya crossings, wander through Yanaka Ginza and Kagurazaka for authentic wood-fired ramen and quiet tea gardens. Super walkable and friendly locals.',
        imageUrl: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=800&q=80',
        likes: 62,
        liked: false,
        comments: [
          { author: 'Priya Sharma', date: 'Aug 15, 2026', text: 'Adding Yanaka to my next Japan itinerary!' }
        ]
      },
      {
        id: 'post-3',
        title: 'Exploring the Medieval Gothic Alleys of Barcelona',
        author: 'Sarah Jenkins',
        location: 'Barcelona, Spain',
        date: 'Aug 10, 2026',
        content: 'The tapas bars around El Born are unmatched! Try the Iberian ham croquettes and local sangria. Walk everywhere — the architecture is simply breathtaking.',
        imageUrl: 'https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=800&q=80',
        likes: 35,
        liked: false,
        comments: []
      }
    ];

    function getCommunityPosts() {
      try {
        const stored = localStorage.getItem('gt_community_posts');
        return stored ? JSON.parse(stored) : DEFAULT_POSTS;
      } catch {
        return DEFAULT_POSTS;
      }
    }

    function saveCommunityPosts(posts) {
      localStorage.setItem('gt_community_posts', JSON.stringify(posts));
    }

    function renderFeed() {
      const container = document.getElementById('communityFeedContainer');
      const posts = getCommunityPosts();

      container.innerHTML = posts.map(post => {
        const initial = (post.author || 'T').charAt(0).toUpperCase();
        return `
          <article class="post-card" onclick="openPostDetailModal('${post.id}')">
            <div class="post-header">
              <div class="author-info">
                <div class="author-avatar">${initial}</div>
                <div>
                  <strong style="color: var(--clr-text); font-size: 0.95rem;">${post.author}</strong>
                  <div style="font-size: 0.78rem; color: var(--clr-text-muted);">${post.date}</div>
                </div>
              </div>
              <span class="badge" style="background: var(--clr-primary-light); color: var(--clr-primary); font-weight: 700;">
                <i class="fas fa-location-dot"></i> ${post.location}
              </span>
            </div>

            <h3 style="margin: 6px 0 8px 0; font-size: 1.15rem; color: var(--clr-text);">${post.title}</h3>
            <p style="color: var(--clr-text-muted); font-size: 0.9rem; line-height: 1.5; margin: 0;">${post.content}</p>

            ${post.imageUrl ? `<img src="${post.imageUrl}" alt="${post.title}" class="post-image-thumb">` : ''}

            <div class="post-actions" onclick="event.stopPropagation()">
              <button type="button" class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                <i class="${post.liked ? 'fas' : 'far'} fa-heart"></i>
                <span>${post.likes} Likes</span>
              </button>
              <button type="button" class="action-btn" onclick="openPostDetailModal('${post.id}')">
                <i class="far fa-comment"></i>
                <span>${(post.comments || []).length} Comments</span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    function toggleLike(postId) {
      const posts = getCommunityPosts();
      const target = posts.find(p => p.id === postId);
      if (!target) return;

      if (target.liked) {
        target.likes = Math.max(0, target.likes - 1);
        target.liked = false;
      } else {
        target.likes = (target.likes || 0) + 1;
        target.liked = true;
      }

      saveCommunityPosts(posts);
      renderFeed();
    }

    function openCreatePostModal() {
      document.getElementById('createPostModal').classList.add('active');
    }

    function closeCreatePostModal() {
      document.getElementById('createPostModal').classList.remove('active');
    }

    function handleCreatePost(e) {
      e.preventDefault();
      const user = window.AuthService.getCurrentUser() || {};
      const author = (user.firstName || '') + (user.lastName ? ' ' + user.lastName : '') || user.username || 'Explorer Traveler';
      const title = document.getElementById('postTitle').value.trim();
      const location = document.getElementById('postLocation').value.trim();
      const content = document.getElementById('postContent').value.trim();
      const imageUrl = document.getElementById('postImageUrl').value.trim();

      const posts = getCommunityPosts();
      const newPost = {
        id: 'post-' + Date.now(),
        title,
        author,
        location,
        date: 'Just now',
        content,
        imageUrl: imageUrl || null,
        likes: 1,
        liked: true,
        comments: []
      };

      posts.unshift(newPost);
      saveCommunityPosts(posts);
      closeCreatePostModal();
      document.getElementById('createPostForm').reset();
      renderFeed();
      window.UIService.showToast('Your travel story has been published!', 'success');
    }

    function openPostDetailModal(postId) {
      const posts = getCommunityPosts();
      const post = posts.find(p => p.id === postId);
      if (!post) return;

      document.getElementById('activeCommentPostId').value = post.id;
      document.getElementById('detailPostTitle').textContent = post.title;
      document.getElementById('detailAuthorName').textContent = post.author;
      document.getElementById('detailPostDate').textContent = post.date;
      document.getElementById('detailPostLocation').textContent = post.location;
      document.getElementById('detailAuthorAvatar').textContent = (post.author || 'T').charAt(0).toUpperCase();
      document.getElementById('detailPostBody').textContent = post.content;

      const imgEl = document.getElementById('detailPostImage');
      if (post.imageUrl) {
        imgEl.src = post.imageUrl;
        imgEl.style.display = 'block';
      } else {
        imgEl.style.display = 'none';
      }

      renderDetailComments(post.comments || []);
      document.getElementById('postDetailModal').classList.add('active');
    }

    function closePostDetailModal() {
      document.getElementById('postDetailModal').classList.remove('active');
    }

    function renderDetailComments(comments) {
      const listEl = document.getElementById('detailCommentsList');
      const countEl = document.getElementById('detailCommentCount');
      countEl.textContent = comments.length;

      if (comments.length === 0) {
        listEl.innerHTML = '<p style="color: var(--clr-text-muted); font-size: 0.85rem; margin: 8px 0;">No comments yet. Be the first to comment!</p>';
        return;
      }

      listEl.innerHTML = comments.map(c => `
        <div class="comment-item">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <strong style="font-size: 0.85rem; color: var(--clr-text);">${c.author}</strong>
            <span style="font-size: 0.75rem; color: var(--clr-text-muted);">${c.date}</span>
          </div>
          <div style="font-size: 0.88rem; color: var(--clr-text);">${c.text}</div>
        </div>
      `).join('');
    }

    function handleAddComment(e) {
      e.preventDefault();
      const postId = document.getElementById('activeCommentPostId').value;
      const inputEl = document.getElementById('inputCommentText');
      const text = inputEl.value.trim();
      if (!text) return;

      const user = window.AuthService.getCurrentUser() || {};
      const author = (user.firstName || '') + (user.lastName ? ' ' + user.lastName : '') || user.username || 'Explorer';

      const posts = getCommunityPosts();
      const target = posts.find(p => p.id === postId);
      if (!target) return;

      if (!target.comments) target.comments = [];
      target.comments.push({
        author,
        date: 'Just now',
        text
      });

      saveCommunityPosts(posts);
      renderDetailComments(target.comments);
      inputEl.value = '';
      renderFeed();
      window.UIService.showToast('Comment added!', 'success');
    }

    document.addEventListener('DOMContentLoaded', renderFeed);
  </script>
</body>
</html>

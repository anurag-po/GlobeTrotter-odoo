<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Itinerary Viewer — GlobeTrotter</title>
  <script>
    if (!localStorage.getItem('gt_user')) {
      window.location.replace('login.html');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .itinerary-hero-banner {
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 28px;
      position: relative;
      background: linear-gradient(135deg, rgba(26, 86, 219, 0.92), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      color: #fff;
      padding: 36px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .itinerary-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .itinerary-stat-card {
      background: var(--clr-white);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    .itinerary-stat-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--clr-text-muted);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .itinerary-stat-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--clr-text);
    }
    .stop-card {
      background: var(--clr-white);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }
    .stop-card:hover {
      box-shadow: var(--shadow-md);
    }
    .stop-header {
      background: #F8FAFC;
      padding: 18px 24px;
      border-bottom: 1px solid var(--clr-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .activity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--clr-border);
      transition: background 0.15s ease;
    }
    .activity-row:hover {
      background: #F8FAFC;
    }
    .activity-row:last-child {
      border-bottom: none;
    }
    .act-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Header Component -->
  <header class="header">
    <a href="index.html" class="header__logo">GlobeTrotter</a>
    <button class="header__hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="header__nav">
      <a href="index.html">Home</a>
      <a href="trips.html" class="active">My Trips</a>
      <a href="search.html">Explore</a>
      <a href="community.html">Community</a>
      <a href="calendar.html">Calendar</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html" style="display: none;">Admin</a>
    </nav>
    <div class="header__profile" title="Profile"><i class="fas fa-user"></i></div>
  </header>

  <!-- Page Content -->
  <main class="page">
    
    <!-- Top Hero Banner for Selected Trip -->
    <div id="itinHeroBanner" class="itinerary-hero-banner">
      <div>
        <span id="itinStatusBadge" class="badge" style="background: rgba(255,255,255,0.25); color: #fff; margin-bottom: 10px; font-weight: 700;">ONGOING TRIP</span>
        <h1 id="itinTripTitle" style="margin: 6px 0 10px 0; font-size: 2.2rem; color: #fff; line-height: 1.2;">Trip Itinerary</h1>
        <div style="font-size: 0.95rem; opacity: 0.95; display: flex; gap: 20px; flex-wrap: wrap;">
          <span><i class="fas fa-location-dot"></i> <span id="itinDestination">Destination</span></span>
          <span><i class="fas fa-calendar-alt"></i> <span id="itinDates">Date Range</span></span>
        </div>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <a href="trips.html" class="btn btn--outline" style="background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); color: #fff !important; font-weight: 700;">
          <i class="fas fa-arrow-left"></i> All Trips
        </a>
        <button type="button" class="btn btn--outline" style="background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); color: #fff !important; font-weight: 700;" onclick="handleShareItinerary()">
          <i class="fas fa-share-nodes"></i> Share
        </button>
        <a href="build-itinerary.html" id="itinEditBuilderBtn" class="btn btn--primary" style="background: #ffffff; color: var(--clr-primary-dark) !important; font-weight: 800;">
          <i class="fas fa-sliders"></i> Edit in Builder
        </a>
      </div>
    </div>

    <!-- Quick Stats Breakdown -->
    <div class="itinerary-stats-row">
      <div class="itinerary-stat-card">
        <div class="itinerary-stat-label">Total Estimated Budget</div>
        <div class="itinerary-stat-val" id="statTotalBudget" style="color: var(--clr-primary);">₹0</div>
      </div>
      <div class="itinerary-stat-card">
        <div class="itinerary-stat-label">Planned Stops / Cities</div>
        <div class="itinerary-stat-val" id="statStopCount">0 Cities</div>
      </div>
      <div class="itinerary-stat-card">
        <div class="itinerary-stat-label">Per Person Estimate (2 Pax)</div>
        <div class="itinerary-stat-val" id="statPerPerson">₹0</div>
      </div>
      <div class="itinerary-stat-card">
        <div class="itinerary-stat-label">Itinerary Status</div>
        <div class="itinerary-stat-val" id="statStatus" style="font-size: 1.15rem; color: #16A34A;">Active</div>
      </div>
    </div>

    <!-- Stops & Schedule Section -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
      <h2 class="section-title" style="margin: 0;"><i class="fas fa-route" style="color: var(--clr-primary);"></i> Day-by-Day Journey &amp; Activities</h2>
      <button type="button" class="btn btn--outline btn--sm" onclick="window.print()">
        <i class="fas fa-print"></i> Print Itinerary
      </button>
    </div>

    <div id="itinStopsContainer">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <script src="js/main.js"></script>
  <script>
    const DEFAULT_USER_TRIPS = [
      {
        id: 'trip-bali',
        name: 'Bali Beach & Temple Getaway',
        destination: 'Bali, Indonesia',
        status: 'ongoing',
        dates: 'Dec 15 – Dec 22, 2026',
        budget: 75000,
        imageUrl: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=800&h=500&fit=crop',
        description: 'Tropical relaxation exploring Ubud rice terraces, Nusa Penida coastal cliffs, and beachfront dining in Seminyak.',
        stops: [
          {
            city: 'Seminyak & Kuta Coast',
            duration: '3 Days',
            dateRange: '15 Dec – 17 Dec',
            budget: 32000,
            activities: [
              { title: 'Beachfront Sunset Lounge & Cocktails', time: '05:30 PM', category: 'Relaxation', cost: 3500 },
              { title: 'Surfing Lessons at Echo Beach', time: '09:00 AM', category: 'Adventure', cost: 2800 },
              { title: 'Uluwatu Cliffside Temple & Kecak Dance', time: '04:00 PM', category: 'Heritage', cost: 1800 }
            ]
          },
          {
            city: 'Ubud Rice Terraces & Waterfalls',
            duration: '4 Days',
            dateRange: '18 Dec – 22 Dec',
            budget: 43000,
            activities: [
              { title: 'Tegallalang Rice Terrace & Giant Swing', time: '08:30 AM', category: 'Sightseeing', cost: 2200 },
              { title: 'Tegenungan Waterfall Forest Trek', time: '11:30 AM', category: 'Adventure', cost: 1200 },
              { title: 'Sacred Monkey Forest Sanctuary Walk', time: '02:30 PM', category: 'Heritage', cost: 1500 }
            ]
          }
        ]
      },
      {
        id: 'trip-swiss',
        name: 'Swiss Alps Winter Wonder',
        destination: 'Zermatt & Interlaken, Switzerland',
        status: 'ongoing',
        dates: 'Dec 18 – Dec 26, 2026',
        budget: 145000,
        imageUrl: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=800&h=500&fit=crop',
        description: 'Skiing and snowboarding around Matterhorn peaks accompanied by scenic glacier railway excursions and cheese fondue.',
        stops: [
          {
            city: 'Zermatt (Matterhorn Alpine Village)',
            duration: '4 Days',
            dateRange: '18 Dec – 21 Dec',
            budget: 80000,
            activities: [
              { title: 'Gornergrat Scenic Cogwheel Railway', time: '09:00 AM', category: 'Sightseeing', cost: 9500 },
              { title: 'Glacier Paradise High-Altitude Skiing', time: '01:00 PM', category: 'Adventure', cost: 12000 },
              { title: 'Traditional Alpine Fondue Tasting', time: '07:30 PM', category: 'Food & Culture', cost: 4500 }
            ]
          },
          {
            city: 'Interlaken & Jungfrau Region',
            duration: '4 Days',
            dateRange: '22 Dec – 26 Dec',
            budget: 65000,
            activities: [
              { title: 'Jungfraujoch Top of Europe Express', time: '08:00 AM', category: 'Sightseeing', cost: 16000 },
              { title: 'Lake Brienz Steamboat Cruise', time: '02:00 PM', category: 'Relaxation', cost: 3200 }
            ]
          }
        ]
      },
      {
        id: 'trip-tokyo',
        name: 'Tokyo & Kyoto Cherry Blossom Odyssey',
        destination: 'Tokyo & Kyoto, Japan',
        status: 'upcoming',
        dates: 'Mar 24 – Apr 04, 2027',
        budget: 185000,
        imageUrl: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=800&h=500&fit=crop',
        description: 'Immersive cultural tour spanning Shinjuku nightlife, historic Kyoto tea ceremonies, and Arashiyama bamboo grove.',
        stops: [
          {
            city: 'Tokyo Metropolis (Shinjuku & Shibuya)',
            duration: '5 Days',
            dateRange: '24 Mar – 28 Mar',
            budget: 95000,
            activities: [
              { title: 'Shinjuku Gyoen Cherry Blossom Picnic', time: '10:00 AM', category: 'Sightseeing', cost: 800 },
              { title: 'TeamLab Planets Borderless Digital Art', time: '02:00 PM', category: 'Sightseeing', cost: 3500 },
              { title: 'Shibuya Crossing & Omoide Yokocho Food Tour', time: '06:30 PM', category: 'Food & Culture', cost: 4800 }
            ]
          },
          {
            city: 'Kyoto Ancient Shrines & Bamboo Forests',
            duration: '6 Days',
            dateRange: '29 Mar – 04 Apr',
            budget: 90000,
            activities: [
              { title: 'Fushimi Inari 10,000 Torii Gates Hike', time: '07:30 AM', category: 'Heritage', cost: 0 },
              { title: 'Arashiyama Bamboo Forest & Sagano Romantic Train', time: '11:00 AM', category: 'Sightseeing', cost: 2200 },
              { title: 'Traditional Matcha Tea Ceremony in Gion', time: '04:00 PM', category: 'Food & Culture', cost: 3800 }
            ]
          }
        ]
      },
      {
        id: 'trip-rajasthan',
        name: 'Rajasthan Royal Palace Heritage Circuit',
        destination: 'Jaipur & Udaipur, Rajasthan, India',
        status: 'completed',
        dates: 'Oct 15 – Oct 22, 2026',
        budget: 35000,
        imageUrl: 'https://images.unsplash.com/photo-1599661046289-e31897846e41?w=800&h=500&fit=crop',
        description: 'Spectacular royal palace heritage circuits, Amber Fort elephant corridors, and private sunset boat rides on Lake Pichola.',
        stops: [
          {
            city: 'Jaipur (The Pink City)',
            duration: '3 Days',
            dateRange: '15 Oct – 17 Oct',
            budget: 18500,
            activities: [
              { title: 'Amber Fort Guided Heritage Tour', time: '09:30 AM', category: 'Heritage', cost: 1200 },
              { title: 'Hawa Mahal & City Palace Walk', time: '02:30 PM', category: 'Sightseeing', cost: 800 },
              { title: 'Chokhi Dhani Traditional Rajasthani Dinner', time: '07:00 PM', category: 'Food & Culture', cost: 1800 }
            ]
          },
          {
            city: 'Udaipur (City of Lakes)',
            duration: '4 Days',
            dateRange: '18 Oct – 22 Oct',
            budget: 16500,
            activities: [
              { title: 'Lake Pichola Sunset Boat Cruise', time: '05:00 PM', category: 'Relaxation', cost: 1000 },
              { title: 'Sajjangarh Monsoon Palace Sunset View', time: '11:00 AM', category: 'Sightseeing', cost: 850 }
            ]
          }
        ]
      }
    ];

    function getCategoryMeta(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('sight')) return { icon: 'fa-mountain-sun', bg: '#EFF6FF', color: '#1D4ED8' };
      if (c.includes('food') || c.includes('dine') || c.includes('cult')) return { icon: 'fa-utensils', bg: '#FEF3C7', color: '#B45309' };
      if (c.includes('adven') || c.includes('trek')) return { icon: 'fa-person-hiking', bg: '#DCFCE7', color: '#15803D' };
      if (c.includes('relax') || c.includes('beach')) return { icon: 'fa-umbrella-beach', bg: '#F3E8FF', color: '#7E22CE' };
      return { icon: 'fa-monument', bg: '#FEE2E2', color: '#B91C1C' };
    }

    function getTrips() {
      try {
        const stored = localStorage.getItem('gt_user_trips');
        return stored ? JSON.parse(stored) : DEFAULT_USER_TRIPS;
      } catch {
        return DEFAULT_USER_TRIPS;
      }
    }

    function handleShareItinerary() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href);
        if (window.UIService) window.UIService.showToast('📋 Itinerary link copied to clipboard!', 'info');
        else alert('Itinerary link copied to clipboard!');
      } else {
        alert('Share URL: ' + window.location.href);
      }
    }

    function renderItinerary() {
      const urlParams = new URLSearchParams(window.location.search);
      const tripId = urlParams.get('tripId');

      const trips = getTrips();
      let trip = trips.find(t => t.id === tripId);
      if (!trip) {
        trip = trips[0] || DEFAULT_USER_TRIPS[0];
      }

      // Populate Header Banner
      document.getElementById('itinTripTitle').textContent = trip.name;
      document.getElementById('itinDestination').textContent = trip.destination;
      document.getElementById('itinDates').textContent = trip.dates || 'Upcoming Journey';
      document.getElementById('itinStatusBadge').textContent = (trip.status || 'Active').toUpperCase();

      if (trip.imageUrl) {
        document.getElementById('itinHeroBanner').style.background = `linear-gradient(135deg, rgba(26, 86, 219, 0.92), rgba(15, 23, 42, 0.85)), url('${trip.imageUrl}') center/cover no-repeat`;
      }

      // Populate Stats
      const totalBudget = trip.budget || (trip.stops || []).reduce((s, st) => s + (st.budget || 0), 0);
      document.getElementById('statTotalBudget').textContent = `₹${Number(totalBudget).toLocaleString('en-IN')}`;
      document.getElementById('statStopCount').textContent = `${(trip.stops || []).length} Stops Planned`;
      document.getElementById('statPerPerson').textContent = `₹${Math.round(totalBudget / 2).toLocaleString('en-IN')}`;
      document.getElementById('statStatus').textContent = (trip.status || 'Active').charAt(0).toUpperCase() + (trip.status || 'Active').slice(1);

      // Render Stops & Day-by-Day Activities
      const stopsContainer = document.getElementById('itinStopsContainer');
      const stops = trip.stops || [];

      if (stops.length === 0) {
        stopsContainer.innerHTML = `
          <div style="text-align: center; padding: 48px 24px; background: var(--clr-white); border-radius: 12px; border: 1px dashed var(--clr-border);">
            <i class="fas fa-map-location-dot" style="font-size: 2.5rem; color: var(--clr-text-muted); margin-bottom: 14px; opacity: 0.6;"></i>
            <h3 style="margin: 0 0 6px 0; color: var(--clr-text);">No Stops Planned Yet</h3>
            <p style="color: var(--clr-text-muted); margin-bottom: 18px;">Click below to add destinations and schedule excursions.</p>
            <a href="build-itinerary.html" class="btn btn--primary"><i class="fas fa-plus"></i> Open Itinerary Builder</a>
          </div>
        `;
        return;
      }

      stopsContainer.innerHTML = stops.map((stop, idx) => {
        const activities = stop.activities || [];
        const activitiesHtml = activities.length > 0 ? activities.map(act => {
          const meta = getCategoryMeta(act.category);
          return `
            <div class="activity-row">
              <div style="display: flex; align-items: center; gap: 14px;">
                <div class="act-icon-box" style="background: ${meta.bg}; color: ${meta.color};">
                  <i class="fas ${meta.icon}"></i>
                </div>
                <div>
                  <strong style="color: var(--clr-text); font-size: 1rem; display: block;">${act.title}</strong>
                  <div style="font-size: 0.82rem; color: var(--clr-text-muted); margin-top: 3px; display: flex; align-items: center; gap: 8px;">
                    <span><i class="far fa-clock"></i> ${act.time || 'Flexible'}</span>
                    <span>&bull;</span>
                    <span class="badge" style="background: ${meta.bg}; color: ${meta.color}; font-size: 0.72rem; padding: 2px 8px; font-weight: 700;">${act.category || 'Sightseeing'}</span>
                  </div>
                </div>
              </div>
              <div style="font-weight: 800; color: var(--clr-text); font-size: 1.05rem; white-space: nowrap;">
                ${act.cost > 0 ? '₹' + Number(act.cost).toLocaleString('en-IN') : '<span style="color: #16A34A; font-weight: 800;">Free</span>'}
              </div>
            </div>
          `;
        }).join('') : '<div style="padding: 20px 24px; color: var(--clr-text-muted); font-size: 0.9rem;">No specific activities added yet for this stop.</div>';

        return `
          <div class="stop-card">
            <div class="stop-header">
              <div>
                <strong style="font-size: 1.15rem; color: var(--clr-text); display: flex; align-items: center; gap: 8px;">
                  <span class="badge" style="background: var(--clr-primary); color: #fff; font-size: 0.75rem; padding: 4px 8px;">Stop ${idx + 1}</span>
                  ${stop.city}
                </strong>
                <div style="font-size: 0.85rem; color: var(--clr-text-muted); margin-top: 4px;">
                  <i class="fas fa-calendar-alt" style="color: var(--clr-primary);"></i> ${stop.dateRange || ''} &bull; ${stop.duration || ''}
                </div>
              </div>
              <div>
                <span class="badge" style="background: var(--clr-primary-light); color: var(--clr-primary); font-size: 0.9rem; padding: 6px 14px; font-weight: 800;">
                  Stop Budget: ₹${Number(stop.budget || 0).toLocaleString('en-IN')}
                </span>
              </div>
            </div>
            <div>
              ${activitiesHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderItinerary);
  </script>
</body>
</html>

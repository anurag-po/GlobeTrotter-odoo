<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trips — GlobeTrotter</title>
  <script>
    if (!localStorage.getItem('gt_user')) {
      window.location.replace('login.html');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .trips-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 120px);
    }
    .trips-tabs {
      background: var(--clr-white);
      border-right: 1px solid var(--clr-border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
    }
    .trips-tabs__tab {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border: none;
      background: transparent;
      color: var(--clr-text-muted);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      border-left: 3px solid transparent;
      transition: all var(--transition);
    }
    .trips-tabs__tab:hover {
      color: var(--clr-primary);
      background: var(--clr-bg);
    }
    .trips-tabs__tab.active {
      color: var(--clr-primary);
      background: var(--clr-primary-light);
      border-left-color: var(--clr-primary);
    }
    .trips-panel {
      display: none;
      padding: 28px 32px;
      background: var(--clr-bg);
    }
    .trips-panel.active {
      display: block;
    }
    .trips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .vtrip-card {
      background: var(--clr-white);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--clr-border);
      display: flex;
      flex-direction: column;
      transition: box-shadow .3s ease, transform .3s ease;
      box-shadow: var(--shadow-sm);
    }
    .vtrip-card:hover {
      box-shadow: 0 10px 25px -5px rgba(0,0,0,.1);
      transform: translateY(-4px);
    }
    .vtrip-card__img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .vtrip-card__body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .vtrip-card__name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--clr-text);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .vtrip-card__meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .85rem;
      color: var(--clr-text-muted);
      margin-bottom: 6px;
    }
    .vtrip-card__desc {
      font-size: .85rem;
      color: var(--clr-text-muted);
      line-height: 1.5;
      margin: 8px 0 16px;
      flex: 1;
    }
    .vtrip-card__action {
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .trips-layout { grid-template-columns: 1fr; }
      .trips-tabs { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--clr-border); padding: 0; }
      .trips-tabs__tab { border-left: none; border-bottom: 3px solid transparent; padding: 14px 18px; white-space: nowrap; }
      .trips-tabs__tab.active { border-left-color: transparent; border-bottom-color: var(--clr-primary); }
      .trips-panel { padding: 20px 16px; }
      .trips-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header Component -->
  <header class="header">
    <a href="index.html" class="header__logo">GlobeTrotter</a>
    <button class="header__hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="header__nav">
      <a href="index.html">Home</a>
      <a href="trips.html" class="active">My Trips</a>
      <a href="search.html">Explore</a>
      <a href="community.html">Community</a>
      <a href="calendar.html">Calendar</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html" style="display: none;">Admin</a>
    </nav>
    <div class="header__profile" title="Profile"><i class="fas fa-user"></i></div>
  </header>

  <!-- Toolbar / Action Bar -->
  <div class="toolbar">
    <div class="toolbar__search">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="tripSearchInput" placeholder="Search your trips by name, destination, or keyword..." oninput="handleFilterTrips()">
    </div>
    <div class="toolbar__actions">
      <a href="create-trip.html" class="btn btn--primary" style="font-weight: 700;">
        <i class="fas fa-plus"></i> + New Trip
      </a>
    </div>
  </div>

  <!-- Trips Layout: Vertical Tabs + Card Grid -->
  <div class="trips-layout">

    <!-- Left: Vertical Tabs -->
    <aside class="trips-tabs" role="tablist">
      <button class="trips-tabs__tab active" data-panel="panel-ongoing" onclick="switchTripTab('ongoing', this)">
        <i class="fas fa-suitcase-rolling"></i> Ongoing (<span id="countOngoing">0</span>)
      </button>
      <button class="trips-tabs__tab" data-panel="panel-upcoming" onclick="switchTripTab('upcoming', this)">
        <i class="fas fa-clock"></i> Upcoming (<span id="countUpcoming">0</span>)
      </button>
      <button class="trips-tabs__tab" data-panel="panel-completed" onclick="switchTripTab('completed', this)">
        <i class="fas fa-check-circle"></i> Completed (<span id="countCompleted">0</span>)
      </button>
    </aside>

    <!-- Right: Tab Content Panels -->
    <div class="trips-content">

      <!-- Ongoing Panel -->
      <section id="panel-ongoing" class="trips-panel active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 class="trips-panel__title" style="margin: 0;">Ongoing Trips</h2>
        </div>
        <div id="gridOngoing" class="trips-grid"></div>
      </section>

      <!-- Upcoming Panel -->
      <section id="panel-upcoming" class="trips-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 class="trips-panel__title" style="margin: 0;">Upcoming Trips</h2>
        </div>
        <div id="gridUpcoming" class="trips-grid"></div>
      </section>

      <!-- Completed Panel -->
      <section id="panel-completed" class="trips-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 class="trips-panel__title" style="margin: 0;">Completed Trips</h2>
        </div>
        <div id="gridCompleted" class="trips-grid"></div>
      </section>

    </div>
  </div>

  <script src="js/main.js"></script>
  <script>

        stops: [

            ]

            ]
          }
        ]
      },
      {
        id: 'trip-swiss',
        name: 'Swiss Alps Winter Wonder',
        destination: 'Zermatt & Interlaken, Switzerland',
        status: 'ongoing',
        dates: 'Dec 18 – Dec 26, 2026',
        budget: 145000,
        imageUrl: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=800&h=500&fit=crop',
        description: 'Skiing and snowboarding around Matterhorn peaks accompanied by scenic glacier railway excursions and cheese fondue.',
        stops: [
          {
            city: 'Zermatt (Matterhorn Alpine Village)',
            duration: '4 Days',
            dateRange: '18 Dec – 21 Dec',
            budget: 80000,
            activities: [
              { title: 'Gornergrat Scenic Cogwheel Railway', time: '09:00 AM', category: 'Sightseeing', cost: 9500 },
              { title: 'Glacier Paradise High-Altitude Skiing', time: '01:00 PM', category: 'Adventure', cost: 12000 },

            ]

            ]

      },

        id: 'trip-tokyo',
        name: 'Tokyo & Kyoto Cherry Blossom Odyssey',
        destination: 'Tokyo & Kyoto, Japan',
        status: 'upcoming',

      },
      {
        id: 'trip-rajasthan',
        name: 'Rajasthan Royal Palace Heritage Circuit',
        destination: 'Jaipur & Udaipur, Rajasthan, India',

        budget: 35000,

        stops: [
          {

              { title: 'Amber Fort Guided Heritage Tour', time: '09:30 AM', category: 'Heritage', cost: 1200 },

              { title: 'Chokhi Dhani Traditional Rajasthani Dinner', time: '07:00 PM', category: 'Food & Culture', cost: 1800 }
            ]
          },
          {
            city: 'Udaipur (City of Lakes)',
            duration: '4 Days',
            dateRange: '18 Oct – 22 Oct',
            budget: 16500,
            activities: [
              { title: 'Lake Pichola Sunset Boat Cruise', time: '05:00 PM', category: 'Relaxation', cost: 1000 },
              { title: 'Sajjangarh Monsoon Palace Sunset View', time: '11:00 AM', category: 'Sightseeing', cost: 850 }
            ]
          }
        ]
      }
    ];

    function getUserTrips() {
      try {
        const stored = localStorage.getItem('gt_user_trips');
        return stored ? JSON.parse(stored) : DEFAULT_USER_TRIPS;
      } catch {
        return DEFAULT_USER_TRIPS;
      }
    }

    function saveUserTrips(trips) {
      localStorage.setItem('gt_user_trips', JSON.stringify(trips));
    }

    function renderTrips(filterText = '') {
      const trips = getUserTrips();
      const query = filterText.toLowerCase().trim();

      const ongoing = trips.filter(t => t.status === 'ongoing' && (!query || t.name.toLowerCase().includes(query) || t.destination.toLowerCase().includes(query)));
      const upcoming = trips.filter(t => t.status === 'upcoming' && (!query || t.name.toLowerCase().includes(query) || t.destination.toLowerCase().includes(query)));
      const completed = trips.filter(t => t.status === 'completed' && (!query || t.name.toLowerCase().includes(query) || t.destination.toLowerCase().includes(query)));

      document.getElementById('countOngoing').textContent = ongoing.length;
      document.getElementById('countUpcoming').textContent = upcoming.length;
      document.getElementById('countCompleted').textContent = completed.length;

      document.getElementById('gridOngoing').innerHTML = renderCardList(ongoing);
      document.getElementById('gridUpcoming').innerHTML = renderCardList(upcoming);
      document.getElementById('gridCompleted').innerHTML = renderCardList(completed);
    }

    function renderCardList(list) {
      if (list.length === 0) {
        return `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px; background: var(--clr-white); border-radius: 12px; border: 1px dashed var(--clr-border); color: var(--clr-text-muted);">
            <i class="fas fa-plane" style="font-size: 2rem; margin-bottom: 12px; opacity: 0.5;"></i>
            <p style="margin: 0; font-weight: 600;">No trips found in this category.</p>
          </div>
        `;
      }

      return list.map(trip => `
        <article class="vtrip-card">
          <img src="${trip.imageUrl || 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=400&q=80'}" alt="${trip.name}" class="vtrip-card__img">
          <div class="vtrip-card__body">
            <h3 class="vtrip-card__name">${trip.name}</h3>
            <div class="vtrip-card__meta"><i class="fas fa-map-marker-alt"></i> ${trip.destination}</div>
            <div class="vtrip-card__meta"><i class="fas fa-calendar-alt"></i> ${trip.dates || 'Upcoming'} &bull; ₹${Number(trip.budget || 0).toLocaleString('en-IN')}</div>
            <p class="vtrip-card__desc">${trip.description || 'Custom multi-city constructed itinerary.'}</p>
            <div class="vtrip-card__action">
              <a href="itinerary.html?tripId=${trip.id}" class="btn btn--primary btn--sm btn--block" style="font-weight: 700; color: #ffffff !important;">
                <i class="fas fa-route"></i> View Itinerary
              </a>
            </div>
          </div>
        </article>
      `).join('');
    }

    function switchTripTab(status, btn) {
      document.querySelectorAll('.trips-tabs__tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.trips-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${status}`).classList.add('active');
    }

    function handleFilterTrips() {
      const query = document.getElementById('tripSearchInput').value;
      renderTrips(query);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('gt_user_trips')) {
        saveUserTrips(DEFAULT_USER_TRIPS);
      }
      renderTrips();
    });
  </script>
</body>
</html>

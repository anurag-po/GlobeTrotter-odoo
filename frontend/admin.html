<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Management Dashboard — GlobeTrotter</title>
  <script>
    try {
      const user = JSON.parse(localStorage.getItem('gt_user') || 'null');
      if (!user || (user.email !== 'admin1234@temporaryaccount.none' && user.role !== 'admin')) {
        alert('Access Denied: The Admin Panel is restricted to system administrators (admin1234@temporaryaccount.none).');
        window.location.replace('login.html');
      }
    } catch (e) {
      window.location.replace('login.html');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    .admin-table th {
      text-align: left;
      padding: 12px 14px;
      font-size: 0.82rem;
      text-transform: uppercase;
      color: var(--clr-text-muted);
      border-bottom: 2px solid var(--clr-border);
      background: var(--clr-bg);
    }
    .admin-table td {
      padding: 14px;
      border-bottom: 1px solid var(--clr-border);
      font-size: 0.9rem;
      vertical-align: middle;
    }
    .user-avatar-sm {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-primary), #0284C7);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <!-- Header Component -->
  <header class="header">
    <a href="index.html" class="header__logo">GlobeTrotter</a>
    <button class="header__hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="header__nav">
      <a href="index.html">Home</a>
      <a href="trips.html">My Trips</a>
      <a href="search.html">Explore</a>
      <a href="community.html">Community</a>
      <a href="calendar.html">Calendar</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>
    <div class="header__profile" title="Profile"><i class="fas fa-user"></i></div>
  </header>

  <!-- Page Content Container -->
  <main class="page">

    <!-- Admin Navigation Tabs -->
    <div class="admin-tabs" role="tablist" aria-label="Admin Navigation Tabs">
      <button type="button" class="admin-tabs__tab active" data-tab="tab-users" role="tab">👥 Manage Users &amp; Roles</button>
      <button type="button" class="admin-tabs__tab" data-tab="tab-cities" role="tab">🏙️ Manage Destinations</button>
      <button type="button" class="admin-tabs__tab" data-tab="tab-activities" role="tab">🎟️ Manage Activities</button>
      <button type="button" class="admin-tabs__tab" data-tab="tab-trends" role="tab">📈 System Analytics</button>
    </div>

    <!-- Tab 1: Manage Users -->
    <section id="tab-users" class="admin-content active" role="tabpanel">
      <div class="admin-chart" id="chart-users" style="width: 100%;">
        <!-- Injected by AdminModule.renderUsersList() -->
      </div>
    </section>

    <!-- Tab 2: Popular Cities / Destinations -->
    <section id="tab-cities" class="admin-content" role="tabpanel">
      <div class="admin-chart" id="chart-cities" style="width: 100%;">
        <!-- Injected by AdminModule.renderPlacesList() -->
      </div>
    </section>

    <!-- Tab 3: Popular Activities -->
    <section id="tab-activities" class="admin-content" role="tabpanel">
      <div class="admin-chart" id="chart-activities" style="width: 100%;">
        <!-- Injected by AdminModule.renderActivitiesList() -->
      </div>
    </section>

    <!-- Tab 4: Analytics -->
    <section id="tab-trends" class="admin-content" role="tabpanel">
      <div style="background: var(--clr-white); padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--clr-border);">
        <h3 style="margin-top: 0; margin-bottom: 8px;">Quarterly Growth &amp; User Engagement</h3>
        <p style="color: var(--clr-text-muted); font-size: 0.85rem; margin-bottom: 24px;">Platform metrics across user registrations, completed itineraries, and booking values.</p>
        <div id="chart-bar-container"></div>
      </div>
    </section>

  </main>

  <!-- Modal: Add Admin -->
  <div class="modal-overlay" id="adminAddUserModal">
    <div class="modal-card" style="max-width: 480px;">
      <div class="modal-header">
        <h3>Add New Administrator</h3>
        <button type="button" class="modal-close" onclick="document.getElementById('adminAddUserModal').classList.remove('active')">&times;</button>
      </div>
      <form id="adminNewAdminForm" onsubmit="window.handleAdminCreateAdmin(event)">
        <div class="modal-body">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label class="form-label">First Name *</label>
              <input type="text" id="admNewFirst" class="form-control" required placeholder="Admin Name">
            </div>
            <div class="form-group">
              <label class="form-label">Last Name *</label>
              <input type="text" id="admNewLast" class="form-control" required placeholder="Surname">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Admin Email Address *</label>
            <input type="email" id="admNewEmail" class="form-control" required placeholder="admin.new@globetrotter.com">
          </div>
          <div class="form-group">
            <label class="form-label">Temporary Password *</label>
            <input type="password" id="admNewPass" class="form-control" required placeholder="AdminPass123!">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn--outline" onclick="document.getElementById('adminAddUserModal').classList.remove('active')">Cancel</button>
          <button type="submit" class="btn btn--primary">Grant Administrator Rights</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>

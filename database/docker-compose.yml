services:
  postgres:
    image: postgres:16-alpine
    container_name: globetrotter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: globetrotter_app
      POSTGRES_PASSWORD: globetrotter_dev_password
      POSTGRES_DB: globetrotter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/init_database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter_app -d globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

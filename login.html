<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GlobalTrotter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-layout">

  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size: 2.2rem; color: var(--clr-primary); margin-bottom: 12px;">
        <i class="fas fa-globe-americas"></i>
      </div>
      <h1>Welcome Back!</h1>
      <p>Sign in to manage and plan your personalized travel itineraries.</p>
    </div>

    <form action="index.html" method="GET">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="priya.sharma@example.com" required>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="#" style="font-size: 0.8rem; font-weight: 600;">Forgot Password?</a>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" value="••••••••" required>
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="remember" name="remember" checked style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--clr-primary);">
        <label for="remember" style="font-size: 0.85rem; color: var(--clr-text-muted); cursor: pointer; margin-bottom: 0;">Keep me logged in on this PC</label>
      </div>

      <button type="submit" class="btn btn--primary btn--block" style="padding: 12px; font-size: 1rem; margin-top: 10px;">
        <span>Login to GlobalTrotter</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="auth-divider">or continue with</div>

    <button type="button" class="btn btn--outline btn--block" onclick="window.location.href='index.html'" style="padding: 12px; font-size: 0.95rem;">
      <i class="fab fa-google" style="color: #EA4335;"></i>
      <span>Continue with Google</span>
    </button>

    <p style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--clr-text-muted);">
      Don't have an account yet?
      <a href="register.html" style="font-weight: 700;">Create your account here</a>
    </p>

    <div style="text-align: center; margin-top: 16px;">
      <a href="search.html" style="font-size: 0.85rem; color: var(--clr-text-muted);">
        <i class="fas fa-chevron-left"></i> Back to Explore
      </a>
    </div>
  </div>

</body>
</html>
